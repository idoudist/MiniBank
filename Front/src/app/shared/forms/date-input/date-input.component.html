<div class="form-group mt-2">
  <input
    type="text"
    class="form-control"
    [class.is-invalid]="ngControl.touched && ngControl.invalid"
    [formControl]="convertToFormControl(ngControl.control)"
    placeholder="{{ label }}"
    bsDatepicker
    [bsConfig]="bsConfig"
    [maxDate]="maxDate"
    [minDate]="minDate"
  />
  <!-- Required validation Message -->
  <div *ngIf="ngControl.control?.errors?.['required']" class="invalid-feedback">
    {{ label }} is required
  </div>
</div>
