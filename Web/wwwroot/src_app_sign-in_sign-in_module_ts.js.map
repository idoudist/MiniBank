<section class="vh-100" style="background-color: #9A616D;">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col col-xl-7">
        <div class="card" style="border-radius: 1rem;">
          <div class="row g-0">
            <div class="col-md-6 d-none d-md-block">
              <img src="assets/images/photos/login.webp"
                alt="login" class="img-fluid" style="border-radius: 1rem 0 0 1rem;" />
            </div>
            <div class="col-md-6 d-flex align-items-center">
              <div class="card-body p-4 p-lg-5 text-black">

                <form [formGroup]="loginForm" (ngSubmit)="login()">

                  <div class="d-flex align-items-center mb-3 pb-1">
                    <i class="fas fa-cubes fa-2x me-3" style="color: #ff6219;"></i>
                    <span class="h1 fw-bold mb-0">{{"SIGN-IN.WELCOME" | translate}}</span>
                  </div>

                  <div class="form-outline mb-4">
                    <input type="email" id="form2Example17" formControlName="username" class="form-control form-control-lg" />
                    <label class="form-label" for="form2Example17">{{"SIGN-IN.USERNAME" | translate}}</label>
                  </div>

                  <div class="form-outline mb-4">
                    <input type="password" id="form2Example27" formControlName="password" class="form-control form-control-lg" />
                    <label class="form-label" for="form2Example27">{{"SIGN-IN.PASSWORD" | translate}}</label>
                  </div>

                  <div class="pt-1 mb-4">
                    <button class="btn btn-dark btn-lg btn-block" type="submit" [disabled]="!loginForm.valid">{{"SIGN-IN.LOGIN" | translate}}</button>
                  </div>

                  <p class="mb-5 pb-lg-2" style="color: #393f81;">{{"SIGN-IN.NO-ACCOUNT" | translate}}<a routerLink="/register"
                      style="color: #393f81;">{{"SIGN-IN.REGISTER" | translate}}</a></p>
                      <p class="mb-5 pb-lg-2" style="color: #393f81;">&#10132;
                        <a [href]="swaggerUrl" target="_blank" style="color: #d61414;">Open Swagger URL</a>
                      </p>
                </form>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
